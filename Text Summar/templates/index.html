<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fb;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: #4A90E2;
        }

        label {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 10px;
            display: block;
        }

        select, textarea, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        select, textarea {
            background-color: #f9f9f9;
            color: #333;
        }

        button {
            background-color: #4A90E2;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #357ABD;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .footer {
            text-align: center;
            font-size: 0.9em;
            color: #888;
            margin-top: 20px;
        }

        .footer a {
            color: #4A90E2;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Text Summarizer</h1>
        <form method="POST" action="/summery_type">
            <div class="form-group">
                <label for="sum_method">Select Summarization Method:</label>
                <select name="sum_method" id="sum_method">
                    <option value="etractive">Extractive</option>
                    <option value="sumy">Sumy (TextRank)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="userText">Enter Text to Summarize:</label>
                <textarea name="userText" id="userText" rows="5" placeholder="Paste your text here..."></textarea>
            </div>

            <button type="submit">Summarize</button>
        </form>

        <div class="footer">
            <p>Powered by <a href="https://www.flask.palletsprojects.com/">Flask</a></p>
        </div>
    </div>
</body>
</html>
